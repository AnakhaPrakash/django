{% extends 'admin/admin_base.html' %}
{% block content %}

<style>
  .card-header {
    background-color: #007bff;
    color: #fff;
    padding: 15px;
  }
  .card-title {
    font-weight: bold;
    margin: 0;
  }
  .table-head-bg-primary thead th {
    background-color: #006dda;
    color: #fff;
    text-align: center;
    font-weight: bold;
  }
  .table td {
    background-color: #fff;
    text-align: center;
    vertical-align: middle;
    border-top: 1px solid #dee2e6;
  }
  .table tbody tr:hover {
    background-color: #e9ecef;
  }
  .profile-cell {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .profile-cell img {
    border-radius: 50%;
    width: 40px;
    height: 40px;
    margin-right: 10px;
  }
</style>

<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title">Teachers</h4>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-head-bg-primary">
            <thead>
              <tr>
                <th scope="col">Name & Profile</th>
                <th scope="col">Contact</th>
                <th scope="col">Email</th>
                <th scope="col" colspan="2">Action</th>
              </tr>
            </thead>
            <tbody>
              {% for t in teachers %}
              <tr>
                <td class="profile-cell">
                  <img src="../static/media/{{ t.profile_picture }}" alt="Profile Picture">
                  {{ t.name }}
                </td>
                <td>{{ t.contact }}</td>
                <td>{{ t.email }}</td>
                <td>
                    <a class="btn btn-info" href="/admin_view_teacher_single?id={{ s.id }}">View</a>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

{% if messages %}
  {% for m in messages %}
  <script>alert("{{ m }}")</script>
  {% endfor %}
{% endif %}

{% endblock %}
