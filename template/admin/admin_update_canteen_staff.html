{% extends 'admin/admin_base.html' %}
{% block content %}
    <div class="container" style="margin-top: 300px;">
        <div class="row mt-lg-n10 mt-md-n11 mt-n10">
            <div class="col-xl-6 col-lg-7 col-md-8 mx-auto">  <!-- Adjusted column width -->
                <div class="card z-index-0">
                    <div class="card-header text-center pt-4">
                        <h5>Update Staff</h5>
                    </div>
                    <div class="card-body">
                        <form role="form text-left" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                              <input type="text" class="form-control" value="{{staff.name}}" placeholder="Name" name="name" aria-label="Name" aria-describedby="email-addon">
                            </div>
                            <div class="mb-3">
                              <input type="text" class="form-control"  value="{{staff.contact}}" placeholder="Contact" name="contact" aria-label="Name" aria-describedby="email-addon">
                            </div>
                    
                            <div class="mb-3">
                              <input type="file" class="form-control" placeholder="Name"  name="profile_picture" aria-label="Name" aria-describedby="email-addon">
                            </div>
            
                            <div class="text-center">
                              <button type="submit" class="btn btn-info">Update</button>
                            </div>
                          </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% if messages %}
    {% for m in messages %}
    <script>alert("{{m}}")</script>
    {% endfor %}
    {% endif %}


{% endblock %}
